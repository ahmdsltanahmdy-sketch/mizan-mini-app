<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مینی‌اپ اختصاصی خبرگزاری میزان</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap');
        body { font-family: 'Vazirmatn', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-[#0b0f17] text-slate-100 antialiased pb-24 selection:bg-emerald-500 selection:text-white">

    <!-- هدر اختصاصی و گرافیکی -->
    <header class="sticky top-0 z-50 bg-[#0b0f17]/90 backdrop-blur-xl border-b border-slate-800/80 px-4 py-3 flex justify-between items-center shadow-2xl">
        <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-400 flex items-center justify-center font-black text-white shadow-lg shadow-emerald-900/30">م</div>
            <div>
                <h1 class="text-xs font-black tracking-wider text-emerald-400">خبرگزاری میزان</h1>
                <p class="text-[9px] text-slate-400">مینی‌اپ اختصاصی و لحظه‌ای</p>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <span class="flex items-center gap-1.5 text-[10px] font-medium bg-emerald-500/10 text-emerald-400 px-3 py-1 rounded-full border border-emerald-500/20 shadow-inner">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span> آنلاین
            </span>
        </div>
    </header>

    <!-- منوی افقی و دسته‌بندی‌ها با استایل اختصاصی -->
    <nav class="flex gap-2 overflow-x-auto px-4 py-3 bg-[#111827]/80 backdrop-blur-md border-b border-slate-800/80 no-scrollbar sticky top-[57px] z-40 shadow-md">
        <button onclick="switchTab('news', 'home', this)" class="tab-btn px-4 py-2 rounded-xl text-xs font-bold bg-emerald-600 text-white whitespace-nowrap transition-all shadow-lg shadow-emerald-900/40">صفحه نخست</button>
        <button onclick="switchTab('news', 'judicial', this)" class="tab-btn px-4 py-2 rounded-xl text-xs font-semibold bg-slate-900/90 text-slate-300 border border-slate-800 whitespace-nowrap transition-all hover:border-emerald-500/40">قضایی</button>
        <button onclick="switchTab('news', 'humanRights', this)" class="tab-btn px-4 py-2 rounded-xl text-xs font-semibold bg-slate-900/90 text-slate-300 border border-slate-800 whitespace-nowrap transition-all hover:border-emerald-500/40">حقوق بشر</button>
        <button onclick="switchTab('news', 'legalMag', this)" class="tab-btn px-4 py-2 rounded-xl text-xs font-semibold bg-slate-900/90 text-slate-300 border border-slate-800 whitespace-nowrap transition-all hover:border-emerald-500/40">مجله حقوقی</button>
        <button onclick="switchTab('news', 'politics', this)" class="tab-btn px-4 py-2 rounded-xl text-xs font-semibold bg-slate-900/90 text-slate-300 border border-slate-800 whitespace-nowrap transition-all hover:border-emerald-500/40">سیاست</button>
        <button onclick="switchTab('news', 'society', this)" class="tab-btn px-4 py-2 rounded-xl text-xs font-semibold bg-slate-900/90 text-slate-300 border border-slate-800 whitespace-nowrap transition-all hover:border-emerald-500/40">جامعه</button>
        <button onclick="switchTab('news', 'economy', this)" class="tab-btn px-4 py-2 rounded-xl text-xs font-semibold bg-slate-900/90 text-slate-300 border border-slate-800 whitespace-nowrap transition-all hover:border-emerald-500/40">اقتصاد</button>
        <button onclick="switchTab('news', 'sports', this)" class="tab-btn px-4 py-2 rounded-xl text-xs font-semibold bg-slate-900/90 text-slate-300 border border-slate-800 whitespace-nowrap transition-all hover:border-emerald-500/40">ورزشی</button>
        <button onclick="switchTab('news', 'photos', this)" class="tab-btn px-4 py-2 rounded-xl text-xs font-semibold bg-slate-900/90 text-slate-300 border border-slate-800 whitespace-nowrap transition-all hover:border-emerald-500/40">عکس</button>
        <!-- تب اختصاصی وکیل آنلاین -->
        <button onclick="switchTab('lawyer', null, this)" class="tab-btn px-4 py-2 rounded-xl text-xs font-bold bg-gradient-to-r from-amber-600 to-amber-500 text-white whitespace-nowrap transition-all shadow-lg shadow-amber-900/30 flex items-center gap-1.5">
            <span>⚖️</span> وکیل آنلاین
        </button>
    </nav>

    <!-- بخش اصلی محتوا -->
    <main class="max-w-xl mx-auto p-4">
        <!-- محتوای اخبار -->
        <div id="news-section" class="space-y-4">
            <div class="text-center py-24 text-slate-500 flex flex-col items-center gap-3">
                <div class="w-8 h-8 border-2 border-emerald-500 border-t-transparent rounded-full animate-spin"></div>
                <p class="text-xs">در حال بارگذاری پرسرعت اخبار از سرور میزان...</p>
            </div>
        </div>

        <!-- محتوای بخش وکیل آنلاین -->
        <div id="lawyer-section" class="hidden space-y-4">
            <div class="bg-gradient-to-br from-slate-900 to-[#111827] border border-amber-500/30 rounded-2xl p-5 shadow-2xl">
                <div class="flex items-center gap-3 mb-4 border-b border-slate-800 pb-3">
                    <span class="text-2xl">⚖️</span>
                    <div>
                        <h2 class="text-sm font-bold text-amber-400">سامانه مشاوره و وکیل آنلاین</h2>
                        <p class="text-[10px] text-slate-400">پرسش حقوقی خود را مطرح کنید تا کارشناسان بررسی کنند.</p>
                    </div>
                </div>
                <form onsubmit="submitLawyerQuery(event)" class="space-y-3">
                    <div>
                        <label class="block text-[11px] font-medium text-slate-300 mb-1">موضوع پرونده / سوال:</label>
                        <select id="law-category" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:border-amber-500 outline-none">
                            <option value="civil">حقوقی (قراردادها، ملکی، مطالبات)</option>
                            <option value="criminal">کیفری (کلاهبرداری، سرقت، توهین)</option>
                            <option value="family">خانواده (مهریه، طلاق، حضانت)</option>
                            <option value="labor">کار و امور اجتماعی</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[11px] font-medium text-slate-300 mb-1">شرح متن سوال:</label>
                        <textarea id="law-text" rows="4" required placeholder="جزئیات پرونده خود را بنویسید..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-slate-200 focus:border-amber-500 outline-none resize-none"></textarea>
                    </div>
                    <button type="submit" class="w-full bg-gradient-to-r from-amber-600 to-amber-500 hover:from-amber-500 hover:to-amber-400 text-white font-bold py-2.5 rounded-xl text-xs shadow-lg transition-all">
                        ارسال به کارشناس ارشد حقوقی
                    </button>
                </form>
                <div id="lawyer-success" class="hidden mt-4 bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs p-3 rounded-xl text-center">
                    سوال شما با موفقیت ثبت شد. نتیجه به زودی از طریق پیام رسان اطلاع‌رسانی می‌شود.
                </div>
            </div>
        </div>
    </main>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let currentCategory = 'home';
        let currentMode = 'news';

        const rssFeeds = {
            home: 'https://www.mizanonline.ir/fa/rss/allnews',
            judicial: 'https://www.mizanonline.ir/fa/rss/17',
            humanRights: 'https://www.mizanonline.ir/fa/rss/7',
            legalMag: 'https://www.mizanonline.ir/fa/rss/16',
            politics: 'https://www.mizanonline.ir/fa/rss/10',
            society: 'https://www.mizanonline.ir/fa/rss/9',
            economy: 'https://www.mizanonline.ir/fa/rss/11',
            sports: 'https://www.mizanonline.ir/fa/rss/13',
            photos: 'https://www.mizanonline.ir/fa/rss/4'
        };

        async function fetchNews(category = 'home') {
            const container = document.getElementById('news-section');
            if (currentMode === 'news') {
                container.innerHTML = `<div class="text-center py-24 text-slate-500 flex flex-col items-center gap-3">
                    <div class="w-8 h-8 border-2 border-emerald-500 border-t-transparent rounded-full animate-spin"></div>
                    <p class="text-xs">در حال بروزرسانی لحظه‌ای...</p>
                </div>`;
            }

            const targetUrl = rssFeeds[category] || rssFeeds.home;
            // استفاده از پروکسی امن و پایدار چندگانه برای عبور از تحریم و سرعت بالا
            const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(targetUrl);

            try {
                const response = await fetch(proxyUrl);
                if (!response.ok) throw new Error('Network error');
                const text = await response.text();
                const parser = new window.DOMParser();
                const xml = parser.parseFromString(text, 'text/xml');
                const items = xml.querySelectorAll('item');

                let newsList = [];
                items.forEach(el => {
                    const title = el.querySelector('title')?.textContent || '';
                    const link = el.querySelector('link')?.textContent || '';
                    const pubDate = el.querySelector('pubDate')?.textContent || '';
                    const description = el.querySelector('description')?.textContent || '';

                    let imageUrl = '';
                    const enclosure = el.querySelector('enclosure');
                    if (enclosure) {
                        imageUrl = enclosure.getAttribute('url');
                    } else {
                        const match = description.match(/<img[^>]+src="([^">]+)"/);
                        if (match) imageUrl = match[1];
                    }

                    newsList.push({
                        title,
                        link,
                        pubDate,
                        contentSnippet: description.replace(/<[^>]*>?/gm, '').substring(0, 130),
                        imageUrl
                    });
                });

                if (newsList.length > 0) {
                    renderNews(newsList);
                } else {
                    container.innerHTML = '<div class="text-center py-20 text-red-400 text-xs">خبری در این بخش یافت نشد.</div>';
                }
            } catch (err) {
                container.innerHTML = `<div class="text-center py-20 text-amber-400 text-xs bg-amber-500/10 border border-amber-500/20 rounded-2xl p-4">
                    خطا در دریافت مستقیم. در حال تلاش مجدد...
                </div>`;
                setTimeout(() => fetchNews(category), 3000);
            }
        }

        function renderNews(items) {
            const container = document.getElementById('news-section');
            container.innerHTML = '';

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'bg-[#111827]/90 border border-slate-800/80 rounded-2xl overflow-hidden shadow-xl hover:border-emerald-500/40 transition-all group';
                
                card.innerHTML = `
                    ${item.imageUrl ? `<div class="overflow-hidden h-44"><img src="${item.imageUrl}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" alt="تصویر خبر"></div>` : ''}
                    <div class="p-4">
                        <h2 class="text-sm font-bold text-slate-100 mb-2 leading-relaxed">${item.title}</h2>
                        <p class="text-[11px] text-slate-400 mb-4 line-clamp-2 leading-relaxed">${item.contentSnippet}</p>
                        <div class="flex justify-between items-center pt-3 border-t border-slate-800/80">
                            <span class="text-[10px] text-slate-500 font-mono">${item.pubDate ? new Date(item.pubDate).toLocaleTimeString('fa-IR', {hour: '2-digit', minute:'2-digit'}) : ''}</span>
                            <a href="${item.link}" target="_blank" class="text-[11px] bg-emerald-600 hover:bg-emerald-500 text-white px-3.5 py-1.5 rounded-xl font-medium transition-colors shadow-lg shadow-emerald-900/30">مشاهده خبر</a>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function switchTab(mode, category, buttonElement) {
            currentMode = mode;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.className = 'tab-btn px-4 py-2 rounded-xl text-xs font-semibold bg-slate-900/90 text-slate-300 border border-slate-800 whitespace-nowrap transition-all hover:border-emerald-500/40';
            });
            buttonElement.className = mode === 'lawyer' 
                ? 'tab-btn px-4 py-2 rounded-xl text-xs font-bold bg-gradient-to-r from-amber-600 to-amber-500 text-white whitespace-nowrap transition-all shadow-lg shadow-amber-900/30 flex items-center gap-1.5'
                : 'tab-btn px-4 py-2 rounded-xl text-xs font-bold bg-emerald-600 text-white whitespace-nowrap transition-all shadow-lg shadow-emerald-900/40';

            const newsSec = document.getElementById('news-section');
            const lawyerSec = document.getElementById('lawyer-section');

            if (mode === 'news') {
                newsSec.classList.remove('hidden');
                lawyerSec.classList.add('hidden');
                currentCategory = category;
                fetchNews(category);
            } else {
                newsSec.classList.add('hidden');
                lawyerSec.classList.remove('hidden');
            }
        }

        function submitLawyerQuery(e) {
            e.preventDefault();
            document.getElementById('lawyer-success').classList.remove('hidden');
            document.getElementById('law-text').value = '';
            setTimeout(() => {
                document.getElementById('lawyer-success').classList.add('hidden');
            }, 5000);
        }

        // بارگذاری اولیه صفحه نخست
        fetchNews('home');

        // بروزرسانی لحظه‌ای خودکار هر ۶۰ ثانیه
        setInterval(() => {
            if (currentMode === 'news') {
                fetchNews(currentCategory);
            }
        }, 60000);
    </script>
</body>
</html>
